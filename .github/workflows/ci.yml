name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – build, migrations check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: ../.github/scripts/run.sh dotnet restore RequestsManagement.sln

      - name: Build
        run: ../.github/scripts/run.sh dotnet build RequestsManagement.sln -c Release --no-restore

      - name: Migrations match the model
        run: |
          dotnet tool restore
          ../.github/scripts/run.sh dotnet ef migrations has-pending-model-changes \
            --project src/RequestsManagement.Infrastructure \
            --startup-project src/RequestsManagement.Api \
            --configuration Release --no-build

      - name: Tests (integration tests run against SQL Server in Docker via Testcontainers)
        run: ../.github/scripts/run.sh dotnet test RequestsManagement.sln -c Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      - name: Test summary
        if: always()
        run: |
          for f in TestResults/*.trx; do
            [ -f "$f" ] || continue
            counters=$(grep -o '<Counters [^>]*>' "$f" | head -1)
            total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$counters" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            name=$(grep -o 'storage="[^"]*"' "$f" | head -1 | sed 's/.*\///; s/\.dll"//')
            echo "::notice title=Tests::${name}: ${passed}/${total} passed, ${failed} failed"
          done

  compose:
    name: Docker Compose – SQL Server, 100,000 requests, API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5080/health; then echo; exit 0; fi
            sleep 5
          done
          docker compose ps -a
          docker compose logs
          exit 1

      - name: Seeder finished successfully
        run: |
          docker compose logs seeder
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq seeder))" = "0"

      - name: Database holds 100,000 requests
        run: |
          count=$(docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'Requests_Dev_Passw0rd!' -C -d RequestsManagement -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Requests")
          echo "Requests: $count"
          test "$count" = "100000"

      - name: API on 100,000 requests (smoke test and response times)
        run: |
          for url in \
            "/api/requests" \
            "/api/requests?status=Waiting&priority=High&pageSize=50" \
            "/api/requests?search=%D7%94%D7%99%D7%AA%D7%A8" \
            "/api/requests?page=500&pageSize=100&sortBy=title&sortDirection=asc" \
            "/api/requests/summary" \
            "/api/requests/summary?priority=High" \
            "/api/lookups"; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" "http://localhost:5080$url")
            echo "::notice title=API::$url -> $code"
            case "$code" in 200*) ;; *) exit 1 ;; esac
          done

      - name: 409 demo script (as in the README)
        shell: pwsh
        run: ./scripts/demo-409.ps1

      - name: Reseed is repeatable
        run: |
          docker compose run --rm seeder --reseed
          count=$(docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'Requests_Dev_Passw0rd!' -C -d RequestsManagement -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Requests")
          test "$count" = "100000"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
