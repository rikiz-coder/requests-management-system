# Runs the whole system locally:
#   docker compose up -d --build       SQL Server + test data (first run) + API + web app (http://localhost:8080)
#   docker compose run --rm seeder --reseed   recreate the 100,000 test requests
#   docker compose down -v             stop and delete the data
#
# The password is for local development only. Override it, or the ports, with environment
# variables or a .env file next to this file (MSSQL_SA_PASSWORD, SQL_PORT, API_PORT, WEB_PORT).

x-connection-string: &connection-string
  ConnectionStrings__RequestsDb: "Server=sqlserver,1433;Database=RequestsManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Requests_Dev_Passw0rd!};TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Requests_Dev_Passw0rd!}
    ports:
      - "${SQL_PORT:-14333}:1433"   # 14333 on the host, so a local SQL Server on 1433 does not clash
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Applies migrations; on the first run (empty database) creates the 100,000 test requests.
  seeder:
    build:
      context: ./backend
      target: seeder
    environment:
      <<: *connection-string
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    environment:
      <<: *connection-string
      ASPNETCORE_ENVIRONMENT: Development
      # Set EF_SQL_LOG_LEVEL=Information to log every SQL command EF Core sends (used by the performance run).
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: ${EF_SQL_LOG_LEVEL:-Warning}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully

  # The Angular app (nginx), which also forwards /api to the API.
  web:
    build:
      context: ./frontend/requests-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  sqldata:
