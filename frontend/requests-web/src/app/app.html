<mat-toolbar class="toolbar">
  <mat-icon>inbox</mat-icon>
  <h1>ניהול פניות</h1>
  <span class="spacer"></span>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="user">
    <mat-label>משתמש נוכחי</mat-label>
    <mat-icon matPrefix>person</mat-icon>
    <mat-select [value]="user.name()" (selectionChange)="user.set($event.value)">
      @for (h of lookups.lookups().handlers; track h) {
        <mat-option [value]="h">{{ h }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-toolbar>
<app-connection-banner (retry)="retry()" />
<main class="main">
  <router-outlet />
</main>
