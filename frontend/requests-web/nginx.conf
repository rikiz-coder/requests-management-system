server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, re-resolved every few seconds: if the API container restarts (new IP) or is stopped,
  # nginx notices at once and answers 502 – the app then shows its "no connection" banner.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:8080;

  # The API, on the same origin as the app (no CORS needed).
  location /api/ {
    proxy_pass $api;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass $api;
    proxy_connect_timeout 3s;
  }

  # Hashed bundles can be cached for a long time; index.html never.
  location ~* \.(?:js|css|woff2?|ico|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (and query strings) all load index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
